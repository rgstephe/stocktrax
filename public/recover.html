<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Allokis · Reset password</title>
  <link rel="icon" href="/img/favicon.svg?v=0.7.0" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/style.css?v=0.7.0" />
  <style>
    .auth-wrap { max-width: 420px; margin: 0 auto; padding: 72px 24px; }
    .auth-brand { text-align: center; margin-bottom: 28px; }
    .auth-brand .wordmark { font-size: 32px; font-weight: 800; letter-spacing: -.03em; color: var(--ink); }
    .auth-sub { text-align: center; color: var(--muted); font-size: 14px; margin-top: 4px; }
    .auth-err { background: var(--take-bg); color: #8f3418; border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-bottom: 14px; display: none; }
    .auth-links { text-align: center; margin-top: 16px; font-size: 14px; }
    .ok-box { background: var(--go-bg); color: #14603f; border-radius: 8px; padding: 16px; text-align: center; }
    .ok-box .code { font-family: var(--mono); font-size: 22px; font-weight: 700; letter-spacing: .04em; margin: 8px 0; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-brand">
      <div class="wordmark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -828 4102 896" class="allokis-logo" role="img" aria-label="Allokis"><rect x="0" y="-828" width="896" height="896" rx="224" fill="#0F5F5C"/><rect x="196" y="-604" width="504" height="98" rx="49" fill="#F6F4EF"/><rect x="196" y="-429" width="364" height="98" rx="49" fill="#7FD1C0"/><rect x="196" y="-254" width="210" height="98" rx="49" fill="#E8A23A"/><path transform="translate(1164 0)" d="M297 -560Q362 -560 410 -534Q459 -509 488 -471V-551H603V0H488V-82Q459 -43 409 -17Q359 9 295 9Q224 9 165 -28Q106 -64 72 -130Q37 -195 37 -278Q37 -361 72 -425Q106 -489 166 -524Q225 -560 297 -560ZM321 -461Q277 -461 239 -440Q201 -418 178 -376Q154 -335 154 -278Q154 -221 178 -178Q201 -135 240 -112Q278 -90 321 -90Q365 -90 403 -112Q441 -134 464 -176Q488 -219 488 -276Q488 -333 464 -375Q441 -417 403 -439Q365 -461 321 -461Z M832 -740V0H718V-740Z M1061 -740V0H947V-740Z M1139 -276Q1139 -360 1176 -425Q1213 -490 1277 -525Q1341 -560 1420 -560Q1499 -560 1563 -525Q1627 -490 1664 -425Q1701 -360 1701 -276Q1701 -192 1663 -127Q1625 -62 1560 -26Q1494 9 1415 9Q1337 9 1274 -26Q1211 -62 1175 -126Q1139 -191 1139 -276ZM1584 -276Q1584 -336 1561 -378Q1538 -419 1500 -440Q1462 -461 1418 -461Q1374 -461 1336 -440Q1299 -419 1277 -378Q1255 -336 1255 -276Q1255 -187 1300 -138Q1346 -90 1415 -90Q1459 -90 1498 -111Q1536 -132 1560 -174Q1584 -216 1584 -276Z M1997 -275 2251 0H2097L1893 -237V0H1779V-740H1893V-310L2093 -551H2251Z M2283 -697Q2283 -728 2304 -749Q2325 -770 2356 -770Q2386 -770 2407 -749Q2428 -728 2428 -697Q2428 -666 2407 -645Q2386 -624 2356 -624Q2325 -624 2304 -645Q2283 -666 2283 -697ZM2412 -551V0H2298V-551Z M2497 -169H2615Q2618 -134 2648 -110Q2679 -87 2725 -87Q2773 -87 2800 -106Q2826 -124 2826 -153Q2826 -184 2796 -199Q2767 -214 2703 -232Q2641 -249 2602 -265Q2563 -281 2534 -314Q2506 -347 2506 -401Q2506 -445 2532 -482Q2558 -518 2606 -539Q2655 -560 2718 -560Q2812 -560 2870 -512Q2927 -465 2931 -383H2817Q2814 -420 2787 -442Q2760 -464 2714 -464Q2669 -464 2645 -447Q2621 -430 2621 -402Q2621 -380 2637 -365Q2653 -350 2676 -342Q2699 -333 2744 -320Q2804 -304 2842 -288Q2881 -271 2909 -239Q2937 -207 2938 -154Q2938 -107 2912 -70Q2886 -33 2838 -12Q2791 9 2727 9Q2662 9 2610 -14Q2559 -38 2529 -78Q2499 -119 2497 -169Z" fill="currentColor"/></svg></div>
      <div class="auth-sub">Reset your password</div>
    </div>

    <div class="card" id="formCard">
      <div class="auth-err" id="err"></div>
      <p style="margin-top:0; color:var(--muted); font-size:13px;">Enter the recovery code you saved when you set up your account, then choose a new password.</p>
      <div class="field"><label>Name</label><input id="name" placeholder="Admin" /></div>
      <div class="field mono"><label>Recovery code</label><input id="code" placeholder="XXXX-XXXX-XXXX" /></div>
      <div class="field"><label>New password</label><input id="newpw" type="password" placeholder="At least 8 characters" /></div>
      <button class="btn btn-primary" id="reset" style="width:100%;">Reset password</button>
    </div>

    <div class="card" id="doneCard" style="display:none;">
      <div class="ok-box">
        <strong>Password reset.</strong>
        <p style="margin:10px 0 4px; font-size:13px;">Here's your new recovery code. Save it somewhere safe. The old one no longer works.</p>
        <div class="code" id="newCode"></div>
      </div>
      <a class="btn btn-primary" href="/login.html" style="width:100%; display:block; text-align:center; margin-top:16px;">Go to sign in</a>
    </div>

    <div class="auth-links"><a href="/login.html">← Back to sign in</a></div>
  </div>

  <script src="/js/api.js?v=0.7.0"></script>
  <script src="/js/branding.js?v=0.7.0"></script>
  <script>
    const err = document.getElementById('err');
    function showErr(m) { err.textContent = m; err.style.display = 'block'; }
    async function reset() {
      err.style.display = 'none';
      try {
        const r = await api.post('/api/recover', {
          name: document.getElementById('name').value.trim(),
          code: document.getElementById('code').value.trim(),
          new_password: document.getElementById('newpw').value,
        });
        document.getElementById('formCard').style.display = 'none';
        document.getElementById('newCode').textContent = r.recovery_code;
        document.getElementById('doneCard').style.display = 'block';
      } catch (e) { showErr(e.message || 'Reset failed'); }
    }
    document.getElementById('reset').addEventListener('click', reset);
  </script>
</body>
</html>
